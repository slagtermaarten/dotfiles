unbind C-b
unbind ^A
unbind r
set -g prefix C-a
# bind C-a send-prefix
# C-a a should send ctrl-a to the underlying shell (move to start of line)
# bind-key a send-prefix
bind-key r source-file "$HOME"/.tmux.conf \; display-message "Config reloaded..."
bind-key s run-shell "source $HOME/.bashrc"
bind-key K confirm kill-server
bind-key q confirm kill-window
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key b break-pane
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Merge chosen window into currently selected pane
# bind-key C-I choose-window "join-pane -v -t "%%""
bind-key c new-window -c "#{pane_current_path}"
bind-key D new-window -c "${MHOME}/dotfiles/"
# bind-key -r i run-shell "tmux neww ${MHOME}/bin/tmux-cht.sh"
bind-key J command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key S command-prompt -p "send pane to:"  "join-pane -t '%%'"
bind-key W command-prompt -p "swap window with:"  "swap-window -t '%%'"

## Reorganize windows, i.e. renumber windows
bind O move-window -r
set -g default-shell /bin/zsh
bind ^A select-pane -t :.+

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"

# set -g default-terminal "screen-256color"
# set-option -a terminal-features 'xterm-256color:RGB'
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -s escape-time 0
set-option -g mouse on
setw -g mode-keys vi
set-window-option -g xterm-keys on
setw -g monitor-activity on
set -g visual-activity on
set -g focus-events on
set -w -g automatic-rename off
set -g set-titles on
set -g set-titles-string "#S"

set -g status-left-length 50
set -g status-left '#[bright]#[fg=red] #H    '
set -g status-right "#[bright]#[fg=red]RAM available: #(free -h | awk 'NR == 2 { print $7 }')#(uptime | cut -d ',' -f 4-)"
set -g status-justify left

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"

# Unbind the backspace key
unbind C-h

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-save-interval '15'

set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
